<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Our Clientele</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #ffffff;
    color: #1e293b;
  }
  .clientele-section {
    padding: 56px 16px;
    background: #ffffff;
  }
  .clientele-header {
    text-align: center;
    max-width: 560px;
    margin: 0 auto 40px;
  }
  .badge-blue {
    display: inline-flex;
    align-items: center;
    padding: 3px 12px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 600;
    background: #eff4ff;
    color: #0066ff;
    border: 1px solid #dce8ff;
  }
  .clientele-header h2 {
    font-size: 24px;
    font-weight: 800;
    color: #0f172a;
    margin-top: 12px;
  }
  .clientele-header p {
    font-size: 13px;
    color: #64748b;
    margin-top: 8px;
  }
  .marquee-row {
    position: relative;
    overflow: hidden;
    background: #ffffff;
  }
  .marquee-row::before,
  .marquee-row::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 64px;
    z-index: 10;
    pointer-events: none;
  }
  .marquee-row::before {
    left: 0;
    background: linear-gradient(to right, #ffffff, transparent);
  }
  .marquee-row::after {
    right: 0;
    background: linear-gradient(to left, #ffffff, transparent);
  }
  .marquee-track {
    display: flex;
    width: max-content;
    align-items: center;
    gap: 16px;
    animation: marquee-left 40s linear infinite;
  }
  .marquee-track.reverse {
    animation-name: marquee-right;
  }
  .marquee-row:hover .marquee-track {
    animation-play-state: paused;
  }
  .marquee-track img {
    height: 64px;
    width: auto;
    flex-shrink: 0;
    user-select: none;
    -webkit-user-drag: none;
  }
  .row-gap { height: 20px; }
  @keyframes marquee-left {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  @keyframes marquee-right {
    from { transform: translateX(-50%); }
    to   { transform: translateX(0); }
  }
</style>
</head>
